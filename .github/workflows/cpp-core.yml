name: C++ Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install library
        run: cmake --install build --prefix "${{ github.workspace }}/build/install"
      - name: Configure external consumer
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"
      - name: Build external consumer
        run: cmake --build build/consumer --parallel 2
      - name: Run external consumer
        run: ctest --test-dir build/consumer --output-on-failure
